<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Coffee</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
</head>
<body>

<div class="container jersey-10-regular">

  <!-- Panel izquierdo -->
  <div class="left-panel">
    <div class="overlay">
      <h1>THE<br>MORNING<br>COFFEE</h1>
      <p>"El primer sorbo del día"</p>
    </div>
  </div>

  <!-- Panel derecho -->
  <div class="right-panel">
    <h2>Iniciar Sesión</h2>
    <p class="welcome">Bienvenido nuevamente ☕</p>

    <form>
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input type="email" placeholder="Correo electrónico">
      </div>

      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" placeholder="Contraseña">
        <i class="fa fa-eye"></i>
      </div>

      <button class="btn">→ COMENZAR</button>

      <div class="divider jersey-10-regular">o continúa con</div>

      <div class="social">
        <button class="google"><i class="fab fa-google"></i> Google</button>
        <button class="facebook"><i class="fab fa-facebook"></i> Facebook</button>
      </div>

      <p class="register">¿No tienes cuenta? <span>Registrarse</span></p>
    </form>
  </div>

</div>

</body>
</html>
